name: daily-fetch

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "vibe-bot"
          git config user.email "vibe-bot@users.noreply.github.com"
          git add data/apps.json
          git diff --cached --quiet || git commit -m "chore: daily github fetch $(date -u +%F)"
          git push
