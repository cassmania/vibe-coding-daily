name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 봇 커밋(GITHUB_TOKEN)은 push 이벤트를 못 일으키므로 수집 완료 후 재배포
  workflow_run:
    workflows: [daily-fetch]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
